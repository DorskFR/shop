[package]
name = "shop"
version = "0.3.0"
edition = "2024"
description = "Searches Amazon Japan and Rakuten Ichiba from the terminal: prices, ratings, specs and top reviews as text or JSON."
license = "MIT"
repository = "https://github.com/DorskFR/shop"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
url = "2"

[profile.release]
lto = true
strip = true
