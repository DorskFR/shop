[package]
name = "shop"
version = "0.9.0"
edition = "2024"
description = "Searches Japanese shops with pure HTTP calls, fast and lightweight."
license = "MIT"
repository = "https://github.com/DorskFR/shop"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
url = "2"

[profile.release]
lto = true
strip = true
