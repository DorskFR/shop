[package]
name = "shop"
version = "0.2.0"
edition = "2024"
description = "Search and inspect products on Amazon (.co.jp, .com) and Rakuten Ichiba from the command line"
license = "MIT"
repository = "https://github.com/DorskFR/shop"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
url = "2"

[profile.release]
lto = true
strip = true
